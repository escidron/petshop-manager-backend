name: Keep Supabase Alive (Prod & Staging)

on:
  schedule:
    # Roda a cada 5 dias às 08:00 UTC (05:00 BRT) - Seguro contra o limite de 7 dias do Supabase
    - cron: "0 8 */5 * *"
  workflow_dispatch: # Permite acionamento manual pelo GitHub Actions

jobs:
  ping:
    name: Ping API Health & Database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Production API (/health/db-quota)
        run: |
          echo "🐾 Pinging Production API to keep Supabase Prod alive..."
          
          RESPONSE=$(curl --silent --show-error --max-time 30 \
            --write-out "\n%{http_code}" \
            "${{ secrets.PRODUCTION_API_URL }}/health/db-quota")
          
          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          
          echo "Prod Response body: $HTTP_BODY"
          echo "Prod HTTP status:   $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "❌ Production health check failed with status $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Supabase Prod is alive and responding!"

      - name: Ping Staging API (/health/db-quota)
        if: "${{ secrets.STAGING_API_URL != '' }}"
        run: |
          echo "🐾 Pinging Staging API to keep Supabase Staging alive..."
          
          RESPONSE=$(curl --silent --show-error --max-time 30 \
            --write-out "\n%{http_code}" \
            "${{ secrets.STAGING_API_URL }}/health/db-quota")
          
          HTTP_BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n 1)
          
          echo "Staging Response body: $HTTP_BODY"
          echo "Staging HTTP status:   $HTTP_CODE"
          
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "⚠️ Staging health check failed with status $HTTP_CODE"
          else
            echo "✅ Supabase Staging is alive and responding!"
          fi
