[project]
name = "petshop-manager"
version = "0.1.0"
description = ""
authors = [
    { name = "escidron", email = "eduardosanchezcidron@gmail.com" }
]
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
    "email-validator>=2.3.0",
    "sqlalchemy>=2.0.45",
    "pydantic-settings>=2.12.0",
    "psycopg2-binary>=2.9.11",
    "psycopg>=3.3.2",
    "alembic>=1.18.1",
    "python-jose>=3.5.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.26",
    "slowapi (>=0.1.9,<0.2.0)",
    "resend (>=2.30.1,<3.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "google-cloud-storage (>=3.12.0,<4.0.0)",
]
requires-python = ">=3.12,<3.14"

[tool.poetry]
package-mode = false

[tool.uv]
package = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
