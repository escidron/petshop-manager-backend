name: Automated Database Backup (Supabase to GCS)

on:
  schedule:
    # Roda todos os dias as 3:00 da manha UTC (Meia noite no Brasil)
    - cron: '0 3 * * *' 
  workflow_dispatch: # Permite rodar o backup manualmente apertando um botao no GitHub

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
    - name: Set Backup Filename & Date Variables
      id: vars
      run: |
        TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
        echo "FILE_NAME=backup_datapet_prod_${TIMESTAMP}.sql.gz" >> $GITHUB_ENV
        echo "DAY_OF_WEEK=$(date +'%u')" >> $GITHUB_ENV  # 1=Segunda, ..., 7=Domingo
        echo "DAY_OF_MONTH=$(date +'%d')" >> $GITHUB_ENV # 01 a 31

    - name: Check Database Size & Alert Sentry
      env:
        DATABASE_URL: ${{ secrets.DB_BACKUP_URL }}
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      run: |
        echo "Consultando tamanho do banco no Supabase..."
        SIZE_BYTES=$(docker run --rm postgres:17 psql "$DATABASE_URL" -t -A -c "SELECT pg_database_size(current_database());" 2>/dev/null || echo "0")
        
        if [ "$SIZE_BYTES" -gt 0 ]; then
          SIZE_MB=$((SIZE_BYTES / 1024 / 1024))
          PERCENT=$((SIZE_MB * 100 / 500))
          echo "-> Tamanho do banco: ${SIZE_MB} MB / 500 MB (${PERCENT}% da cota gratuita)"
          
          if [ "$SIZE_MB" -ge 350 ]; then
            echo "-> Alerta de cota atingido (>= 350 MB / 70%)! Enviando notificação para o Sentry..."
            pip install --quiet sentry-sdk
            SIZE_MB="$SIZE_MB" PERCENT="$PERCENT" python3 -c "import textwrap; exec(textwrap.dedent('''
                import os, sentry_sdk
                dsn = os.getenv('SENTRY_DSN')
                size_mb = int(os.getenv('SIZE_MB', '0'))
                percent = int(os.getenv('PERCENT', '0'))
                if dsn:
                    sentry_sdk.init(dsn=dsn, traces_sample_rate=1.0)
                    level = 'error' if size_mb >= 425 else 'warning'
                    prefix = 'URGENTE' if size_mb >= 425 else 'AVISO DE COTA'
                    msg = f'{prefix}: Banco de dados em {size_mb} MB ({percent}% da cota gratuita de 500 MB).'
                    if size_mb >= 425:
                        msg += ' Risco iminente de limite atingido! Faça upgrade para o plano Pro imediatamente.'
                    else:
                        msg += ' Planeje o upgrade para o plano Pro ou limpeza de dados.'
                    sentry_sdk.set_tag('component', 'database-quota')
                    sentry_sdk.set_tag('database_size_mb', str(size_mb))
                    sentry_sdk.set_tag('quota_percent', f'{percent}%')
                    sentry_sdk.capture_message(msg, level=level)
                    sentry_sdk.flush(timeout=10)
                    print('Alerta enviado com sucesso ao Sentry!')
                else:
                    print('AVISO: SENTRY_DSN não encontrado nos secrets do GitHub!')
            '''))"
          else
            echo "-> Tamanho dentro da margem segura (< 70% / 350 MB). Nenhum alerta necessário."
          fi
        else
          echo "Aviso: Não foi possível obter o tamanho do banco."
        fi

    - name: Dump Supabase Database
      env:
        # A URL de conexao do banco de producao (PORTA 5432) guardada nos Secrets
        DATABASE_URL: ${{ secrets.DB_BACKUP_URL }}
      run: |
        set -eo pipefail
        echo "Iniciando backup do banco de dados (usando imagem Docker do Postgres 17 para compatibilidade)..."
        # Usamos docker para garantir que a versao do pg_dump bata com a do Supabase (PG 17)
        docker run --rm -i postgres:17 pg_dump "$DATABASE_URL" -F p --clean | gzip > ${{ env.FILE_NAME }}
        echo "Backup concluido localmente: ${{ env.FILE_NAME }} ($(du -h ${{ env.FILE_NAME }} | cut -f1))"

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        # O arquivo JSON da Service Account guardado nos Secrets
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Upload Backup to Google Cloud Storage (GFS Strategy)
      env:
        # O nome do seu bucket exclusivo de backups guardado nos Secrets do GitHub
        GCS_BACKUP_BUCKET_NAME: ${{ secrets.GCS_BACKUP_BUCKET_NAME }}
      run: |
        echo "Fazendo upload para o Google Cloud Storage (Bucket: $GCS_BACKUP_BUCKET_NAME)..."

        # 1. Backup Diário: Salva sempre na pasta daily/
        echo "-> [DAILY] Enviando backup diário..."
        gsutil cp ${{ env.FILE_NAME }} gs://$GCS_BACKUP_BUCKET_NAME/database_backups/daily/${{ env.FILE_NAME }}

        # 2. Backup Semanal: Todo domingo (dia 7), salva cópia na pasta weekly/
        if [ "${{ env.DAY_OF_WEEK }}" = "7" ]; then
          echo "-> [WEEKLY] Domingo detectado! Salvando cópia de retenção semanal..."
          gsutil cp ${{ env.FILE_NAME }} gs://$GCS_BACKUP_BUCKET_NAME/database_backups/weekly/${{ env.FILE_NAME }}
        fi

        # 3. Backup Mensal: No 1º dia de cada mês (dia 01), salva cópia na pasta monthly/
        if [ "${{ env.DAY_OF_MONTH }}" = "01" ]; then
          echo "-> [MONTHLY] 1º dia do mês detectado! Salvando cópia de retenção mensal..."
          gsutil cp ${{ env.FILE_NAME }} gs://$GCS_BACKUP_BUCKET_NAME/database_backups/monthly/${{ env.FILE_NAME }}
        fi

        echo "Upload concluído com sucesso e organizado na nuvem!"
